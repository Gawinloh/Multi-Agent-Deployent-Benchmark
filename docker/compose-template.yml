{#-
  Jinja2 skeleton for docker-compose.yml, rendered by
  src/validator/docker_runner.py.

  The per-service blocks are NOT here. Each service owns its fragment in
  docker/services/<name>.yml, registered on its ServiceDefinition in
  src/services/catalog.py; the runner renders the fragments of the services
  the StackSpec actually selects and substitutes them as `service_blocks`,
  in dependency order. A service that is None in the spec contributes
  nothing — no block, no volume, and no depends_on edge from anything else.
  `volumes_section` is likewise empty when no selected service needs a
  volume, since an empty `volumes:` key is not valid compose.

  This block is a Jinja comment, not a YAML one: it is stripped at render
  time, which keeps the rendered file byte-identical to the one the
  pre-catalog template produced.
-#}
# docker-compose Jinja2 template — rendered by src/validator/docker_runner.py.
# Do not `docker compose up` this file directly; it contains template variables.
#
# Design notes:
# - Each run gets its own bridge network and named volume (suffixed with
#   run_id) so concurrent runs never collide.
# - nginx host ports are parameterised (defaults 8080/8443) instead of
#   80/443 so multiple stacks can coexist and no root privileges are needed.
# - deploy.resources.limits are populated from the StackSpec's
#   HardwareConstraints by the runner.
# - Healthchecks: pg_isready (postgres), curl (nginx), redis-cli ping
#   (redis; the exact command is computed by the runner because it may
#   need the requirepass password).

services:
{{ service_blocks }}
{{ volumes_section }}
networks:
  net_{{ run_id }}:
    driver: bridge
    name: stack_{{ run_id }}_net
