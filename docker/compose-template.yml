# docker-compose Jinja2 template — rendered by src/validator/docker_runner.py.
# Do not `docker compose up` this file directly; it contains template variables.
#
# Design notes:
# - Each run gets its own bridge network and named volume (suffixed with
#   run_id) so concurrent runs never collide.
# - nginx host ports are parameterised (defaults 8080/8443) instead of
#   80/443 so multiple stacks can coexist and no root privileges are needed.
# - deploy.resources.limits are populated from the StackSpec's
#   HardwareConstraints by the runner.
# - Healthchecks: pg_isready (postgres), curl (nginx), redis-cli ping
#   (redis; the exact command is computed by the runner because it may
#   need the requirepass password).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "{{ postgres_password }}"
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
{%- if postgres_ssl %}
      - ./certs/server.crt:/var/lib/postgresql/server.crt:ro
      - ./certs/server.key:/var/lib/postgresql/server.key:ro
{%- endif %}
      - pgdata_{{ run_id }}:/var/lib/postgresql/data
    command: {{ postgres_command }}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: {{ pg_mem_mb }}M
          cpus: "{{ pg_cpus }}"
    networks:
      - net_{{ run_id }}

  redis:
    image: redis:7
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "{{ redis_health_cmd }}"]
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: {{ redis_mem_mb }}M
          cpus: "{{ redis_cpus }}"
    networks:
      - net_{{ run_id }}

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    ports:
      - "{{ nginx_http_port }}:80"
      - "{{ nginx_https_port }}:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: {{ nginx_mem_mb }}M
          cpus: "{{ nginx_cpus }}"
    networks:
      - net_{{ run_id }}

volumes:
  pgdata_{{ run_id }}:

networks:
  net_{{ run_id }}:
    driver: bridge
    name: stack_{{ run_id }}_net
