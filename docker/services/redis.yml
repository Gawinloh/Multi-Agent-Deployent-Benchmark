  redis:
    image: redis:7
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "{{ healthcheck }}"]
      interval: 2s
      timeout: 5s
      retries: 30
{%- if depends_on %}
    depends_on:
{%- for dependency in depends_on %}
      {{ dependency }}:
        condition: service_healthy
{%- endfor %}
{%- endif %}
    deploy:
      resources:
        limits:
          memory: {{ mem_mb }}M
          cpus: "{{ cpus }}"
    networks:
      - net_{{ run_id }}
