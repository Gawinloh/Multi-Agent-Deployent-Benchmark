[project]
name = "dissertation-multi-agent-deployment"
version = "0.1.0"
description = "Multi-agent LLM systems for multi-service software deployment — MSc dissertation system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gawin Lohaburananont", email = "gawin.lohaburananont@warwick.ac.uk" },
]
license = { text = "TBD" }

dependencies = [
    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",

    # LLM clients
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "google-generativeai>=0.8.0",

    # Structured output
    "instructor>=1.5.0",
    "pydantic>=2.9.0",

    # RAG
    "llama-index>=0.11.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",

    # Docker / system control
    "docker>=7.1.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "requests>=2.32.0",

    # Data analysis
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",

    # Config and logging
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
