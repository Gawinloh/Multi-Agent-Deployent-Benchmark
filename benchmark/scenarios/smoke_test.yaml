id: smoke_test_001
description: "Smoke test scenario — small dev environment on constrained hardware"

request: |
  I need a small dev web stack for an internal tool. Approximately 5 concurrent
  developers will use it. The Postgres database will hold about 5 GB of test data.
  We're running on a single host with 8 GB RAM and 4 vCPU. No production traffic,
  no compliance constraints, but use sane security defaults (TLS where appropriate,
  no default passwords).

ground_truth:
  workload_class: BALANCED
  compliance: NONE
  expected_postgres:
    shared_buffers_range: ["1GB", "2GB"]
    max_connections_range: [20, 50]
    ssl: true
    password_encryption: "scram-sha-256"
  expected_nginx:
    server_tokens: false
    ssl_protocols_min: "TLSv1.2"
  expected_redis:
    maxmemory_set: true
    maxmemory_policy_acceptable: ["allkeys-lru", "allkeys-lfu", "noeviction"]
    requirepass_or_acl: true
  expected_cis_minimum_pass_rate: 0.75
