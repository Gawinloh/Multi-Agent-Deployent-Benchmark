# rabbitmq.conf - generated, do not edit by hand
# sysctl format (RabbitMQ 3.7+); the classic Erlang-terms
# rabbitmq.config format is deprecated.

# --- Listeners (RabbitMQ Networking docs) ---
listeners.tcp.default = 0.0.0.0:5672
heartbeat = 60
max_connections = 500

# --- Resource alarms (RabbitMQ Memory/Disk Alarms docs) ---
vm_memory_high_watermark.relative = 0.4
vm_memory_high_watermark_paging_ratio = 0.5
disk_free_limit.absolute = 2GB

# --- Default account (RabbitMQ Production Checklist) ---
default_user = appuser
default_pass = change-me-strong-password
loopback_users.guest = true

# --- TLS (RabbitMQ TLS Support docs) ---
# TLS listener not enabled by this specification

# --- Management plugin (RabbitMQ Management docs) ---
management.tcp.ip = 127.0.0.1
management.tcp.port = 15672
